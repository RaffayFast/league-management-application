name: leaguehub
description: LeagueHub - NaSCon '26 multi-sport league and club operations app.
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.27+ (CardThemeData, Color.withValues)
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  intl: ^0.19.0
  open_filex: ^4.5.0
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
