<div class="modal-backdrop" data-modal-backdrop hidden></div>
<div class="modal" id="auth-modal" data-testid="progressive-auth-modal" role="dialog" aria-modal="true"
     aria-labelledby="auth-title" aria-describedby="auth-reason" hidden>
  <div class="modal-head">
    <h2 id="auth-title">Sign in to continue</h2>
    <button type="button" class="icon-button" data-modal-close aria-label="Close and keep watching">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p id="auth-reason" class="modal-reason">Guests can watch and fill a cart. Chat and checkout need a free account.</p>
  <p class="modal-keep">You stay on this page. Your cart (<span data-cart-mirror>0</span>) and your place in the stream are kept.</p>
  <div class="tabs" role="tablist" aria-label="Log in or register">
    <button type="button" class="tab" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true">Log in</button>
    <button type="button" class="tab" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" tabindex="-1">Register</button>
  </div>
  <form class="auth-form" id="panel-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
    <label for="login-email">Email</label>
    <input id="login-email" data-testid="auth-login-email" name="email" type="email" autocomplete="email" required>
    <label for="login-password">Password</label>
    <input id="login-password" data-testid="auth-login-password" name="password" type="password" autocomplete="current-password" required>
    <p class="form-error" role="alert" data-form-error hidden></p>
    <button type="submit" class="btn btn-lime btn-block" data-testid="auth-login-submit">Log in</button>
  </form>
  <form class="auth-form" id="panel-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
    <label for="register-name">Name</label>
    <input id="register-name" data-testid="auth-register-name" name="name" type="text" autocomplete="name" maxlength="80" required>
    <label for="register-email">Email</label>
    <input id="register-email" data-testid="auth-register-email" name="email" type="email" autocomplete="email" required>
    <label for="register-password">Password <span class="hint">(at least 8 characters)</span></label>
    <input id="register-password" data-testid="auth-register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <p class="form-error" role="alert" data-form-error hidden></p>
    <button type="submit" class="btn btn-lime btn-block" data-testid="auth-register-submit">Create account</button>
  </form>
</div>
